<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess ELO Estimator</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Chess ELO Estimator</h1>
      <span class="badge" id="model-status">Loading model...</span>
    </header>

    <div class="main-layout">
      <div class="side-panel">
        <div id="results-panel" class="results-panel">
          <div class="result-row">
            <span class="player-name" id="white-name">White</span>
            <div class="elo-block">
              <span class="elo-value" id="white-elo">—</span>
              <span class="elo-range" id="white-elo-range">—</span>
            </div>
          </div>
          <div class="result-row">
            <span class="player-name" id="black-name">Black</span>
            <div class="elo-block">
              <span class="elo-value" id="black-elo">—</span>
              <span class="elo-range" id="black-elo-range">—</span>
            </div>
          </div>
          <div class="result-detail">
            <span>Match rate:</span>
            <span id="match-rate">—</span>
          </div>
          <div id="header-info" class="header-info" style="display:none"></div>
        </div>

        <div id="progress-container" class="progress-container" style="display:none">
          <div class="progress-bar-track">
            <div id="progress-bar" class="progress-bar-fill"></div>
          </div>
          <span id="progress-text" class="progress-text"></span>
        </div>

        <div class="input-section">
          <label for="pgn-input">PGN Game</label>
          <textarea id="pgn-input" rows="12" placeholder="Paste a PGN game here...&#10;&#10;[Event &quot;Example&quot;]&#10;[White &quot;Player 1&quot;]&#10;[Black &quot;Player 2&quot;]&#10;[Result &quot;1-0&quot;]&#10;&#10;1. e4 e5 2. Nf3 Nc6 ..."></textarea>
          <div class="input-actions">
            <button id="example-btn" class="btn btn-secondary">Load Example</button>
            <button id="estimate-btn" class="btn btn-primary" disabled>Estimate ELO</button>
          </div>
        </div>
      </div>

      <div class="board-panel">
        <div class="board-header">
          <span id="ply-label">Paste a PGN and press Estimate ELO to load the board</span>
          <span id="viewer-status"></span>
        </div>
        <div id="board" class="board-empty"></div>
        <div class="nav-controls">
          <button id="nav-start" class="btn btn-secondary nav-btn" disabled title="Start (Home)">&#x23EE;</button>
          <button id="nav-prev" class="btn btn-secondary nav-btn" disabled title="Previous move (&#8592;)">&#x25C0;</button>
          <button id="nav-next" class="btn btn-secondary nav-btn" disabled title="Next move (&#8594;)">&#x25B6;</button>
          <button id="nav-end" class="btn btn-secondary nav-btn" disabled title="End (End)">&#x23ED;</button>
        </div>
        <div id="move-list" class="move-list"></div>
        <div class="topk-panel">
          <div class="topk-title">Top 5 predicted moves by ELO
            <span class="topk-sub">(750–2500, step 250 · played move highlighted)</span>
          </div>
          <div id="topk-body" class="topk-body">
            <div class="topk-empty">No position loaded.</div>
          </div>
        </div>
      </div>
    </div>

    <footer>
      Powered by <a href="https://github.com/UofTCSSLab/Maia3" target="_blank">Maia3</a> neural network
      &middot; Runs entirely in your browser
    </footer>
  </div>

  <!-- onnxruntime-web v1.17.0 (self-contained, no dynamic imports) -->
  <script src="js/ort.min.js"></script>
  <!-- chess.js -->
  <script type="module" src="js/chess-wrapper.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
